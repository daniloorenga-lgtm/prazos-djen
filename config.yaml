# Conferência de prazos no site (§0 uso_2). Credenciais SÓ em LEGALCLOUD_USER / LEGALCLOUD_PASS (.env).
# Os campos do site não puderam ser inspecionados na construção: rode `python src/legalcloud.py --explorar`
# uma vez e ajuste `campos` (lista de candidatos: label=..., css=..., role=button:..., text=...).
legalcloud:
  url: https://app.legalcloud.com.br/calculadora/
  url_login: https://app.legalcloud.com.br/login/
  url_calculadora: https://app.legalcloud.com.br/calculadora/
  timeout_segundos: 45
  headless: true
  conferir_no_dry_run: true       # a conferência só lê o site; pode rodar em --dry-run
  data_informada: disponibilizacao   # o DJEN trabalha sempre por data de disponibilização (D0); é ela que se informa ao site
  tribunais_nomes:                # como o site escreve cada tribunal (se diferente da sigla)
    TJSP: TJSP
    TJPR: TJPR
    TRF3: TRF3
    STJ: STJ
    STF: STF
  campos: {}                      # sobrescreve os candidatos padrão de src/legalcloud.py, por nome de campo

# Usados pela rotina semanal (prompt 03) para extrair o calendário do Legalcloud.
tribunais_monitorados: [TJSP, TJPR, TRF3, STJ, STF, TJRJ, TJMG, TRT2, TRT15]
comarcas:
  TJSP: [São Paulo, Campinas, Santo Amaro, Guarulhos, Osasco, Barueri, Santos, São Bernardo do Campo]
  TJPR: [Curitiba]
